<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acquirenti biglietti — Scaro</title>
<meta name="robots" content="noindex,nofollow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F4E7DB;color:#164194;min-height:100vh;padding:24px}
.wrap{max-width:960px;margin:0 auto}
.card{border:3px solid #164194;background:#fff;padding:24px;margin-bottom:20px}
h1{font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
input{width:100%;max-width:320px;font-family:inherit;font-size:15px;padding:10px;border:2px solid #164194}
button{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:11px 20px;border:2px solid #164194;background:#E8D7BE;color:#164194;cursor:pointer;margin-top:12px}
button:active{opacity:.8}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{border:1px solid #164194;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#164194;color:#F4E7DB;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
tr:nth-child(even){background:#F8EFE2}
.used-yes{color:#1b5e20;font-weight:700}
.used-no{color:#b3261e;font-weight:700}
.status{margin-top:14px;font-size:14px}
.bad{color:#b3261e;font-weight:600}
.summary{font-family:monospace;font-size:13px;color:#444;margin-bottom:10px}
.empty{color:#666;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Acquirenti biglietti — Scaro</h1>
    <label for="key">Chiave admin (ADMIN_KEY)</label>
    <input type="password" id="key" placeholder="quella impostata su Cloudflare">
    <br>
    <button id="load-btn">Carica elenco</button>
    <div id="status" class="status"></div>
  </div>
  <div class="card">
    <h1>Check-in per email</h1>
    <label for="checkin-email">Email acquirente</label>
    <input type="text" id="checkin-email" placeholder="nome@esempio.it">
    <br>
    <button id="checkin-email-btn">Fai check-in a tutti i suoi biglietti</button>
    <div id="checkin-email-status" class="status"></div>
  </div>
  <div class="card">
    <h1>Recupera pagamenti PayPal senza biglietto</h1>
    <label for="reconcile-key">Chiave riconciliazione (RECONCILE_KEY)</label>
    <input type="password" id="reconcile-key" placeholder="quella impostata su Cloudflare">
    <label for="reconcile-days">Ultimi quanti giorni</label>
    <input type="text" id="reconcile-days" value="3" style="max-width:80px">
    <br>
    <button id="reconcile-btn">Cerca pagamenti mancanti</button>
    <div id="reconcile-status" class="status"></div>
    <div id="reconcile-result"></div>
  </div>
  <div id="result"></div>
</div>
<script>
const API_BASE = 'https://scaro-biglietti.scaro.workers.dev';

document.getElementById('key').value = localStorage.getItem('scaro_admin_key') || '';

document.getElementById('load-btn').onclick = function(){
  var key = document.getElementById('key').value.trim();
  var status = document.getElementById('status');
  var result = document.getElementById('result');
  if(!key){ status.innerHTML = '<span class="bad">Inserisci la chiave.</span>'; return; }
  localStorage.setItem('scaro_admin_key', key);
  status.textContent = 'Caricamento…';
  result.innerHTML = '';
  fetch(API_BASE + '/api/tickets', { headers: { 'X-Admin-Key': key } })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, data:d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){
        status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata (o ADMIN_KEY non impostata su Cloudflare).' : 'Errore nel caricamento.') + '</span>';
        return;
      }
      status.textContent = '';
      // Nascondi gli acquisti di prova (nostri/test interni) dal riepilogo:
      // i biglietti restano comunque validi, spariscono solo da questa vista.
      var excludedEmails = ['fedeneri.fm'];
      var tickets = (res.data.tickets || []).filter(function(t){
        var email = (t.buyerEmail || '').toLowerCase();
        return !excludedEmails.some(function(ex){ return email.indexOf(ex) !== -1; });
      });
      if(!tickets.length){
        result.innerHTML = '<div class="card empty">Nessun biglietto venduto finora.</div>';
        return;
      }
      var usedCount = tickets.filter(function(t){ return t.used; }).length;
      var payLabel = function(t){
        if(t.paid === false) return '<span class="bad">Da pagare</span>';
        if(t.paymentMethod === 'cash') return 'Contanti (botteghino)';
        if(t.paymentMethod === 'bancomat') return 'Bancomat (botteghino)';
        return 'Online (PayPal)';
      };
      var rows = tickets.map(function(t){
        return '<tr>'
          + '<td>' + (t.createdAt ? new Date(t.createdAt).toLocaleString('it-IT') : '') + '</td>'
          + '<td>' + (t.eventTitle || t.eventId || '') + '</td>'
          + '<td>' + (t.tierLabel || '') + '</td>'
          + '<td>' + (t.buyerName || '') + '</td>'
          + '<td>' + (t.buyerEmail || '') + '</td>'
          + '<td>' + payLabel(t) + '</td>'
          + '<td>' + t.code + '</td>'
          + '<td class="' + (t.used ? 'used-yes' : 'used-no') + '">' + (t.used ? '✓ Entrato' : '— Non ancora') + '</td>'
          + '<td><button class="del-btn" data-code="' + t.code + '" style="margin:0;padding:6px 10px;font-size:11px;background:#fbdcdc;border-color:#b3261e;color:#b3261e">Elimina</button></td>'
          + '</tr>';
      }).join('');
      result.innerHTML = '<div class="card">'
        + '<div class="summary">' + tickets.length + ' biglietti totali · ' + usedCount + ' già entrati</div>'
        + '<div style="overflow-x:auto"><table><thead><tr>'
        + '<th>Acquistato il</th><th>Evento</th><th>Tariffa</th><th>Nome</th><th>Email</th><th>Pagamento</th><th>Codice</th><th>Ingresso</th><th></th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
        + '</div>';
      document.querySelectorAll('.del-btn').forEach(function(btn){
        btn.onclick = function(){
          var code = btn.dataset.code;
          if(!confirm('Eliminare definitivamente il biglietto ' + code + '?')) return;
          var savedKey = document.getElementById('key').value.trim();
          fetch(API_BASE + '/api/ticket/' + encodeURIComponent(code), { method: 'DELETE', headers: { 'X-Admin-Key': savedKey } })
            .then(function(r){ return r.json(); })
            .then(function(d){
              if(d && d.ok){ btn.closest('tr').remove(); }
              else { alert('Errore nell\'eliminazione.'); }
            })
            .catch(function(){ alert('Errore di rete.'); });
        };
      });
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; });
};

document.getElementById('checkin-email-btn').onclick = function(){
  var key = document.getElementById('key').value.trim();
  var email = document.getElementById('checkin-email').value.trim();
  var status = document.getElementById('checkin-email-status');
  if(!key){ status.innerHTML = '<span class="bad">Inserisci prima la chiave admin qui sopra.</span>'; return; }
  if(!email){ status.innerHTML = '<span class="bad">Inserisci un\'email.</span>'; return; }
  status.textContent = 'Check-in in corso…';
  fetch(API_BASE + '/api/tickets/checkin-by-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
    body: JSON.stringify({ email: email })
  })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){
        status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata.' : 'Errore, riprova.') + '</span>';
        return;
      }
      var results = res.data.results || [];
      if(!results.length){ status.innerHTML = '<span class="bad">Nessun biglietto trovato per questa email.</span>'; return; }
      var checkedIn = results.filter(function(r){ return r.status === 'checked-in'; }).length;
      var already = results.filter(function(r){ return r.status === 'already-used'; }).length;
      var notPaid = results.filter(function(r){ return r.status === 'not-paid'; }).length;
      var msg = checkedIn + ' biglietto/i registrati ora';
      if(already) msg += ', ' + already + ' già entrati in precedenza';
      if(notPaid) msg += ', ' + notPaid + ' non pagati (saltati)';
      status.textContent = msg + '.';
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; });
};

/* ← Evento e tariffe attuali, usate per abbinare rapidamente un pagamento
   trovato a un biglietto. Aggiorna qui quando cambia l'evento. */
const RECONCILE_EVENT = { id: 'cabaret-barbecue', title: 'Cabaret & Barbecue — Stefano Chiodaroli' };
const RECONCILE_TIERS = [
  { id: 'sedia', label: 'Posto a sedere', price: 10 },
  { id: 'combo', label: 'Sedia + panino + salsiccia + birra ghiacciata', price: 15.99 }
];

document.getElementById('reconcile-btn').onclick = function(){
  var rkey = document.getElementById('reconcile-key').value.trim();
  var days = document.getElementById('reconcile-days').value.trim() || '3';
  var status = document.getElementById('reconcile-status');
  var result = document.getElementById('reconcile-result');
  if(!rkey){ status.innerHTML = '<span class="bad">Inserisci la chiave di riconciliazione.</span>'; return; }
  status.textContent = 'Ricerca in corso…';
  result.innerHTML = '';
  fetch(API_BASE + '/api/reconcile?days=' + encodeURIComponent(days), { headers: { 'X-Reconcile-Key': rkey } })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){
        status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata.' : 'Errore, riprova.') + '</span>';
        return;
      }
      var missing = res.data.dettaglio || [];
      status.textContent = res.data.transazioniCompletate + ' pagamenti completati esaminati · ' + missing.length + ' senza biglietto';
      if(!missing.length){ result.innerHTML = '<div class="card empty">Nessun pagamento mancante trovato.</div>'; return; }

      var tierOptions = RECONCILE_TIERS.map(function(t){ return '<option value="' + t.id + '">' + t.label + ' (' + t.price + ' €)</option>'; }).join('');
      var bulkHTML = '<div class="card">'
        + '<label>Tariffa da usare per tutti (puoi comunque cambiarla singolarmente sotto)</label>'
        + '<select id="rec-bulk-tier" style="width:100%;max-width:320px;padding:8px;border:2px solid #164194;font-family:inherit">' + tierOptions + '</select>'
        + '<button id="rec-bulk-btn">Genera biglietti per TUTTI (' + missing.length + ')</button>'
        + '<div id="rec-bulk-status" class="status"></div>'
        + '</div>';
      var rows = missing.map(function(m, i){
        return '<div class="card">'
          + '<div><b>' + (m.payerName || 'Nome sconosciuto') + '</b> — ' + (m.payerEmail || 'email sconosciuta') + '</div>'
          + '<div style="font-size:12px;color:#444">Importo: ' + m.amount + ' ' + m.currency + ' · ' + (m.date || '') + ' · Ordine: ' + m.orderId + '</div>'
          + '<label>Tariffa corrispondente</label>'
          + '<select id="rec-tier-' + i + '" style="width:100%;max-width:320px;padding:8px;border:2px solid #164194;font-family:inherit">' + tierOptions + '</select>'
          + '<button data-idx="' + i + '" class="rec-gen-btn">Genera biglietto per questo pagamento</button>'
          + '<div id="rec-status-' + i + '" class="status"></div>'
          + '</div>';
      }).join('');
      result.innerHTML = bulkHTML + rows;

      function generateForIndex(i, tierId){
        var m = missing[i];
        var tier = RECONCILE_TIERS.find(function(t){ return t.id === tierId; });
        var rstatus = document.getElementById('rec-status-' + i);
        var btn = document.querySelector('.rec-gen-btn[data-idx="' + i + '"]');
        if(rstatus) rstatus.textContent = 'Generazione in corso…';
        var akey = document.getElementById('key').value.trim();
        if(!akey){ if(rstatus) rstatus.innerHTML = '<span class="bad">Inserisci prima la ADMIN_KEY nel riquadro in alto.</span>'; return Promise.resolve(false); }
        return fetch(API_BASE + '/api/reconcile-create-ticket', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Key': akey },
          body: JSON.stringify({
            orderId: m.orderId, eventId: RECONCILE_EVENT.id, eventTitle: RECONCILE_EVENT.title,
            tierId: tier.id, tierLabel: tier.label,
            buyerEmail: m.payerEmail, buyerName: m.payerName
          })
        })
          .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
          .then(function(res2){
            if(!res2.ok || !res2.data.ok){
              if(rstatus) rstatus.innerHTML = '<span class="bad">Errore, riprova.</span>';
              return false;
            }
            if(rstatus) rstatus.innerHTML = '<span style="color:#1b5e20;font-weight:700">✓ Biglietto ' + res2.data.code + ' generato' + (res2.data.emailSent ? ' e inviato via email' : ' (email non inviata, controlla manualmente)') + (res2.data.alreadyIssued ? ' — era già stato generato prima' : '') + '</span>';
            if(btn) btn.disabled = true;
            return true;
          })
          .catch(function(){ if(rstatus) rstatus.innerHTML = '<span class="bad">Errore di rete.</span>'; return false; });
      }

      document.querySelectorAll('.rec-gen-btn').forEach(function(btn){
        btn.onclick = function(){
          var i = btn.dataset.idx;
          var tierId = document.getElementById('rec-tier-' + i).value;
          generateForIndex(i, tierId);
        };
      });

      document.getElementById('rec-bulk-btn').onclick = function(){
        var bulkTier = document.getElementById('rec-bulk-tier').value;
        var bulkStatus = document.getElementById('rec-bulk-status');
        var btn = document.getElementById('rec-bulk-btn');
        btn.disabled = true;
        var done = 0;
        bulkStatus.textContent = 'Generazione in corso… 0 / ' + missing.length;
        var chain = Promise.resolve();
        missing.forEach(function(m, i){
          chain = chain.then(function(){
            return generateForIndex(i, bulkTier).then(function(){
              done++;
              bulkStatus.textContent = 'Generazione in corso… ' + done + ' / ' + missing.length;
            });
          });
        });
        chain.then(function(){
          bulkStatus.innerHTML = '<span style="color:#1b5e20;font-weight:700">✓ Fatto: ' + done + ' / ' + missing.length + ' biglietti generati</span>';
        });
      };
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; });
};
</script>
</body>
</html>
