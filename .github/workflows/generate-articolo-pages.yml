name: Genera anteprime articoli

on:
  push:
    branches: [main]
    paths:
      - index.html
      - "content/talks/**"
      - "content/eventi/**"

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[skip og]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ricostruisci content/scaro-content.js dai file del pannello
        run: node scripts/build-content.js

      - name: Genera articolo/*.html da MEDIA_ITEMS, EVENTI_FUTURI e dai contenuti del pannello
        run: node scripts/generate-articolo-pages.js

      - name: Committa i file generati (se cambiati)
        run: |
          git config user.name "scaro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articolo/ content/scaro-content.js
          if git diff --cached --quiet; then
            echo "Nessun file da aggiornare."
          else
            git commit -m "chore: rigenera contenuti e anteprime [skip og]"
            git push
          fi
