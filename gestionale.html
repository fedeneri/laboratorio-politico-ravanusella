<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale — Scaro</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#164194;--cream:#F4E7DB;--yellow:#F2B708;--red:#D96552;
  --warm:#E8D7BE;--soft:#F8EFE2;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--cream);color:var(--blue);min-height:100vh;padding:24px 14px}
.card{max-width:480px;width:100%;margin:0 auto;border:1px solid var(--blue);background:#fff;padding:26px;box-shadow:6px 6px 0 var(--blue)}
h1{font-family:var(--font-display);font-weight:900;font-style:italic;font-size:22px;letter-spacing:.01em;margin-bottom:18px;text-align:center;color:var(--blue)}
label{display:block;font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 7px;color:var(--blue)}
input[type=text],input[type=password]{width:100%;font-family:var(--font-body);font-size:16px;padding:12px 14px;border:1px solid var(--blue);background:var(--soft)}
input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--yellow);outline-offset:-1px}
.tiers,.pay{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--blue);padding:13px 14px;cursor:pointer;background:#fff;transition:background .12s}
.opt input{width:18px;height:18px}
.opt.selected{background:var(--warm)}
.opt .lbl{font-family:var(--font-body);font-weight:600;font-size:14px}
.opt .price{margin-left:auto;font-family:var(--font-mono);font-size:15px;font-weight:600}
button{font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 22px;border:1px solid var(--blue);background:var(--blue);color:var(--cream);cursor:pointer;width:100%;margin-top:18px;transition:transform .08s}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.secondary{background:#fff;color:var(--blue)}
.status{margin-top:14px;font-family:var(--font-mono);font-size:13px}
.bad{color:var(--red);font-weight:600}
.ok-text{color:#1b5e20;font-weight:600}
.result{text-align:center}
.code{font-family:var(--font-mono);font-size:24px;letter-spacing:2px;font-weight:600;margin:16px 0;padding:18px;border:1px solid #1b5e20;background:#e6f5ea;color:#1b5e20}
.code.pending{border-color:var(--red);background:#fbeae6;color:var(--red)}
.info{font-family:var(--font-body);font-size:13px;color:#444;margin-bottom:6px;line-height:1.6}
.nav{display:flex;flex-wrap:wrap;gap:4px;max-width:480px;margin:0 auto 12px}
.nav-btn{flex:1;min-width:78px;text-align:center;font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:10px 4px;border:1px solid var(--blue);background:#fff;cursor:pointer;color:var(--blue);transition:background .12s}
.nav-btn.active{background:var(--blue);color:var(--cream)}
.qty-row{display:flex;align-items:center;gap:16px;margin-bottom:4px}
.qty-row button{width:46px;margin:0;padding:11px;background:var(--warm);color:var(--blue);border-color:var(--blue)}
.qty-value{font-family:var(--font-mono);font-size:20px;font-weight:600;min-width:28px;text-align:center}
table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px;margin-top:10px}
th,td{border:1px solid var(--warm);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--blue);color:var(--cream);font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
tr:nth-child(even){background:var(--soft)}
.used-yes{color:#1b5e20;font-weight:600}
.used-no{color:var(--red);font-weight:600}
.summary{font-family:var(--font-mono);font-size:12px;color:#666;margin-bottom:10px}
.del-btn{width:auto;margin:0;padding:6px 10px;font-size:10px;background:#fbeae6;border-color:var(--red);color:var(--red)}
#session-summary{margin-top:22px;padding-top:16px;border-top:1px dashed var(--warm)}
#session-summary h2{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;color:#666}
.sum-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:13px;padding:3px 0}
.sum-row b{font-weight:600}
.sum-list{max-height:140px;overflow-y:auto;margin-top:6px;font-family:var(--font-mono);font-size:11px}
.sum-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--soft)}
.wide{max-width:960px}
.logo-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--warm)}
.logo-row img{width:48px;height:48px;object-fit:contain}
.logo-row span{font-family:var(--font-display);font-weight:900;font-style:italic;font-size:26px;letter-spacing:.01em;color:var(--blue)}
</style>
</head>
<body>

<div id="gate" class="card">
  <div class="logo-row"><img src="pomodoro_originale_trasparente.png" alt="Scaro"><span>SCARO TICKET</span></div>
  <h1>Gestionale</h1>
  <label for="key">Chiave admin</label>
  <input type="password" id="key" placeholder="ADMIN_KEY">
  <button id="unlock-btn">Entra</button>
  <div id="gate-status" class="status"></div>
</div>

<div id="app" style="display:none">
  <div class="logo-row"><img src="pomodoro_originale_trasparente.png" alt="Scaro"><span>SCARO TICKET</span></div>

  <div id="event-picker" class="card" style="max-width:480px">
    <h1>Scegli evento</h1>
    <div id="event-cards"></div>
  </div>

  <div id="app-main" style="display:none">
    <div class="card" style="max-width:480px;margin:0 auto 10px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div style="font-weight:700;font-size:13px" id="current-event-label"></div>
      <button id="change-event-btn" class="secondary" style="width:auto;margin:0;padding:8px 12px;font-size:11px">Cambia evento</button>
    </div>
    <div class="nav">
    <div class="nav-btn active" data-view="sell">Vendita</div>
    <div class="nav-btn" data-view="reserve">Prenota</div>
    <div class="nav-btn" data-view="confirm">Conf. pag.</div>
    <div class="nav-btn" data-view="checkin-code">Check-in</div>
    <div class="nav-btn" data-view="checkin-email">Check-in gruppo</div>
    <div class="nav-btn" data-view="list">Lista</div>
    <div class="nav-btn" data-view="reconcile">Pagamenti</div>
  </div>
  <div id="view-wrap" class="card"></div>
  </div>
</div>

<script>
const API_BASE = 'https://scaro-biglietti.scaro.workers.dev';

/* ← Elenco eventi disponibili. Aggiungi qui un evento nuovo con il suo id,
   titolo e tariffe, comparirà nel selettore in alto. Il primo della lista
   è quello selezionato di default all'apertura. */
const EVENTS = [
  {
    id: 'cabaret-barbecue', title: 'Cabaret & Barbecue — Stefano Chiodaroli',
    tiers: [
      { id: 'sedia', label: 'Posto a sedere', price: 10 },
      { id: 'combo', label: 'Sedia + panino + salsiccia + birra ghiacciata', price: 15.99 }
    ]
  },
  {
    id: 'prova', title: 'Evento di prova',
    tiers: [
      { id: 'test-a', label: 'Tariffa test A', price: 1 },
      { id: 'test-b', label: 'Tariffa test B', price: 2 }
    ]
  }
];
let selectedEvent = EVENTS[0];
function TIERS_current(){ return selectedEvent.tiers; }
const PAYMENTS = [
  { id: 'cash', label: 'Contanti' },
  { id: 'bancomat', label: 'Bancomat' }
];

let adminKey = '';
let currentView = 'sell';
let selectedTier = null;
let selectedPayment = null;
let currentQty = 1;
let sessionLog = [];

function unlock(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  showEventPicker();
}

function showEventPicker(){
  document.getElementById('app-main').style.display = 'none';
  document.getElementById('event-picker').style.display = 'block';
  document.getElementById('event-cards').innerHTML = EVENTS.map(function(e){
    return '<div class="opt" data-event="' + e.id + '" style="margin-bottom:8px"><span class="lbl">' + e.title + '</span></div>';
  }).join('');
  document.querySelectorAll('#event-cards .opt').forEach(function(el){
    el.onclick = function(){
      selectedEvent = EVENTS.find(function(e){ return e.id === el.dataset.event; }) || EVENTS[0];
      enterEvent();
    };
  });
}

function enterEvent(){
  document.getElementById('event-picker').style.display = 'none';
  document.getElementById('app-main').style.display = 'block';
  document.getElementById('current-event-label').textContent = selectedEvent.title;
  selectedTier = null;
  selectedPayment = null;
  currentQty = 1;
  currentView = 'sell';
  document.querySelectorAll('.nav-btn').forEach(function(t){ t.classList.remove('active'); });
  document.querySelector('.nav-btn[data-view="sell"]').classList.add('active');
  renderView();
}

document.getElementById('change-event-btn').onclick = showEventPicker;

function getCodeFromUrl(){
  var m = location.search.match(/[?&]c=([^&]+)/);
  return m ? decodeURIComponent(m[1]).toUpperCase() : '';
}

var urlCode = getCodeFromUrl();
if(urlCode){
  // Da QR: il check-in singolo non richiede la chiave admin ne' la scelta
  // dell'evento, quindi si salta dritti alla verifica del biglietto.
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('event-picker').style.display = 'none';
  document.getElementById('app-main').style.display = 'block';
  document.getElementById('current-event-label').textContent = selectedEvent.title;
  document.querySelectorAll('.nav-btn').forEach(function(t){ t.classList.remove('active'); });
  document.querySelector('.nav-btn[data-view="checkin-code"]').classList.add('active');
  currentView = 'checkin-code';
  renderView();
  document.getElementById('checkin-code').value = urlCode;
  checkTicketCode(urlCode);
}

document.getElementById('unlock-btn').onclick = function(){
  adminKey = document.getElementById('key').value.trim();
  if(!adminKey){ document.getElementById('gate-status').innerHTML = '<span class="bad">Inserisci la chiave.</span>'; return; }
  localStorage.setItem('scaro_admin_key', adminKey);
  unlock();
};
var savedKey = localStorage.getItem('scaro_admin_key');
if(savedKey && !urlCode){ adminKey = savedKey; unlock(); }
if(savedKey && urlCode){ adminKey = savedKey; }

document.querySelectorAll('.nav-btn').forEach(function(el){
  el.onclick = function(){
    document.querySelectorAll('.nav-btn').forEach(function(t){ t.classList.remove('active'); });
    el.classList.add('active');
    currentView = el.dataset.view;
    selectedTier = null;
    selectedPayment = null;
    currentQty = 1;
    renderView();
  };
});

function renderView(){
  var wrap = document.getElementById('view-wrap');
  wrap.className = 'card' + (currentView === 'list' ? ' wide' : '');
  if(currentView === 'sell') renderSellForm();
  else if(currentView === 'reserve') renderReserveForm();
  else if(currentView === 'confirm') renderConfirmForm();
  else if(currentView === 'checkin-code') renderCheckinCodeForm();
  else if(currentView === 'checkin-email') renderCheckinEmailForm();
  else if(currentView === 'list') renderListView();
  else if(currentView === 'reconcile') renderReconcileView();
}

function tierOptHTML(t){
  return '<div class="opt" data-tier="' + t.id + '">'
    + '<input type="radio" name="tier">'
    + '<span class="lbl">' + t.label + '</span>'
    + '<span class="price">' + t.price.toFixed(2).replace('.', ',') + ' €</span>'
    + '</div>';
}
function payOptHTML(p){
  return '<div class="opt" data-pay="' + p.id + '">'
    + '<input type="radio" name="pay">'
    + '<span class="lbl">' + p.label + '</span>'
    + '</div>';
}
function bindTierOpts(onChange){
  document.querySelectorAll('.opt[data-tier]').forEach(function(el){
    el.onclick = function(){
      document.querySelectorAll('.opt[data-tier]').forEach(function(o){ o.classList.remove('selected'); });
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      selectedTier = TIERS_current().find(function(t){ return t.id === el.dataset.tier; });
      onChange();
    };
  });
}
function bindPayOpts(onChange){
  document.querySelectorAll('.opt[data-pay]').forEach(function(el){
    el.onclick = function(){
      document.querySelectorAll('.opt[data-pay]').forEach(function(o){ o.classList.remove('selected'); });
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      selectedPayment = el.dataset.pay;
      onChange();
    };
  });
}
function qtyPickerHTML(){
  return '<label>Quantità</label><div class="qty-row">'
    + '<button type="button" id="qty-minus">−</button>'
    + '<span class="qty-value" id="qty-value">' + currentQty + '</span>'
    + '<button type="button" id="qty-plus">+</button></div>';
}
function bindQtyPicker(onChange){
  document.getElementById('qty-minus').onclick = function(){ currentQty = Math.max(1, currentQty - 1); document.getElementById('qty-value').textContent = currentQty; onChange(); };
  document.getElementById('qty-plus').onclick = function(){ currentQty = Math.min(20, currentQty + 1); document.getElementById('qty-value').textContent = currentQty; onChange(); };
}

function logSession(entry){
  sessionLog.unshift(entry);
  renderSessionSummary();
}
function renderSessionSummary(){
  var box = document.getElementById('session-summary');
  if(!box) return;
  var venduti = sessionLog.filter(function(e){ return e.kind === 'sell'; });
  var prenotati = sessionLog.filter(function(e){ return e.kind === 'reserve'; });
  var cashTotal = venduti.filter(function(e){ return e.payment === 'cash'; }).reduce(function(s,e){ return s + e.total; }, 0);
  var bancomatTotal = venduti.filter(function(e){ return e.payment === 'bancomat'; }).reduce(function(s,e){ return s + e.total; }, 0);
  var qtyVenduti = venduti.reduce(function(s,e){ return s + e.qty; }, 0);
  var qtyPrenotati = prenotati.reduce(function(s,e){ return s + e.qty; }, 0);
  if(!sessionLog.length){ box.innerHTML = ''; return; }
  var rows = sessionLog.slice(0, 10).map(function(e){
    var tag = e.kind === 'sell' ? (e.payment === 'cash' ? 'Contanti' : 'Bancomat') : (e.kind === 'reserve' ? 'Prenotato' : 'Confermato');
    return '<div class="sum-item"><span>' + e.name + ' · ' + e.qty + '×</span><span>' + tag + '</span></div>';
  }).join('');
  box.innerHTML = '<h2>Riepilogo di stasera</h2>'
    + '<div class="sum-row"><span>Venduti</span><b>' + qtyVenduti + '</b></div>'
    + '<div class="sum-row"><span>· contanti</span><b>' + cashTotal.toFixed(2).replace('.', ',') + ' €</b></div>'
    + '<div class="sum-row"><span>· bancomat</span><b>' + bancomatTotal.toFixed(2).replace('.', ',') + ' €</b></div>'
    + '<div class="sum-row"><span>Prenotati</span><b>' + qtyPrenotati + '</b></div>'
    + '<div class="sum-list">' + rows + '</div>';
}

/* --- Vendita --- */
function renderSellForm(){
  document.getElementById('view-wrap').innerHTML =
    '<h1>Vendita diretta</h1>'
    + '<label>Tariffa</label><div class="tiers">' + TIERS_current().map(tierOptHTML).join('') + '</div>'
    + '<label>Pagamento</label><div class="pay">' + PAYMENTS.map(payOptHTML).join('') + '</div>'
    + '<label for="buyer-name">Nome</label><input type="text" id="buyer-name" placeholder="Nome e cognome">'
    + qtyPickerHTML()
    + '<button id="submit-btn" disabled>Genera biglietto</button>'
    + '<div id="status" class="status"></div>'
    + '<div id="session-summary"></div>';
  bindTierOpts(checkSellReady);
  bindPayOpts(checkSellReady);
  bindQtyPicker(checkSellReady);
  document.getElementById('buyer-name').oninput = checkSellReady;
  document.getElementById('submit-btn').onclick = submitSell;
  renderSessionSummary();
}
function checkSellReady(){
  var name = document.getElementById('buyer-name').value.trim();
  document.getElementById('submit-btn').disabled = !(selectedTier && selectedPayment && name);
}
function submitSell(){
  var name = document.getElementById('buyer-name').value.trim();
  var status = document.getElementById('status');
  status.textContent = 'Generazione in corso…';
  document.getElementById('submit-btn').disabled = true;
  fetch(API_BASE + '/api/box-office-ticket', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
    body: JSON.stringify({ eventId: selectedEvent.id, eventTitle: selectedEvent.title, tierId: selectedTier.id, tierLabel: selectedTier.label, price: selectedTier.price, buyerName: name, paymentMethod: selectedPayment, qty: currentQty })
  })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){ status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata.' : 'Errore, riprova.') + '</span>'; document.getElementById('submit-btn').disabled = false; return; }
      var codes = res.data.codes || [res.data.code];
      logSession({ kind: 'sell', name: name, qty: codes.length, payment: selectedPayment, total: selectedTier.price * codes.length });
      var total = (selectedTier.price * codes.length).toFixed(2).replace('.', ',');
      document.getElementById('view-wrap').innerHTML = '<div class="result"><div class="info"><b>' + selectedTier.label + '</b> × ' + codes.length + ' — ' + total + ' €</div><div class="info">' + name + '</div>' + codes.map(function(c){ return '<div class="code">' + c + '</div>'; }).join('') + '<button id="new-btn" class="secondary">Nuovo</button></div>';
      document.getElementById('new-btn').onclick = renderView;
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; document.getElementById('submit-btn').disabled = false; });
}

/* --- Prenotazione --- */
function renderReserveForm(){
  document.getElementById('view-wrap').innerHTML =
    '<h1>Prenotazione (paga dopo)</h1>'
    + '<label>Tariffa</label><div class="tiers">' + TIERS_current().map(tierOptHTML).join('') + '</div>'
    + '<label for="buyer-name">Nome</label><input type="text" id="buyer-name" placeholder="Nome e cognome">'
    + qtyPickerHTML()
    + '<button id="submit-btn" disabled>Genera codice prenotazione</button>'
    + '<div id="status" class="status"></div>';
  bindTierOpts(checkReserveReady);
  bindQtyPicker(checkReserveReady);
  document.getElementById('buyer-name').oninput = checkReserveReady;
  document.getElementById('submit-btn').onclick = submitReserve;
}
function checkReserveReady(){
  var name = document.getElementById('buyer-name').value.trim();
  document.getElementById('submit-btn').disabled = !(selectedTier && name);
}
function submitReserve(){
  var name = document.getElementById('buyer-name').value.trim();
  var status = document.getElementById('status');
  status.textContent = 'Generazione in corso…';
  document.getElementById('submit-btn').disabled = true;
  fetch(API_BASE + '/api/box-office-reserve', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
    body: JSON.stringify({ eventId: selectedEvent.id, eventTitle: selectedEvent.title, tierId: selectedTier.id, tierLabel: selectedTier.label, price: selectedTier.price, buyerName: name, qty: currentQty })
  })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){ status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata.' : 'Errore, riprova.') + '</span>'; document.getElementById('submit-btn').disabled = false; return; }
      var codes = res.data.codes || [res.data.code];
      logSession({ kind: 'reserve', name: name, qty: codes.length, payment: '', total: selectedTier.price * codes.length });
      document.getElementById('view-wrap').innerHTML = '<div class="result"><div class="info"><b>' + selectedTier.label + '</b> × ' + codes.length + ' — da pagare</div><div class="info">' + name + '</div>' + codes.map(function(c){ return '<div class="code pending">' + c + '</div>'; }).join('') + '<button id="new-btn" class="secondary">Nuova prenotazione</button></div>';
      document.getElementById('new-btn').onclick = renderView;
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; document.getElementById('submit-btn').disabled = false; });
}

/* --- Conferma pagamento --- */
function renderConfirmForm(){
  document.getElementById('view-wrap').innerHTML =
    '<h1>Conferma pagamento</h1>'
    + '<label for="lookup-code">Codice biglietto</label><input type="text" id="lookup-code" placeholder="XXXX-XXXX-XX" maxlength="14" style="text-transform:uppercase">'
    + '<button id="lookup-btn">Cerca</button>'
    + '<div id="status" class="status"></div><div id="lookup-result"></div>';
  document.getElementById('lookup-btn').onclick = lookupCode;
}
function lookupCode(){
  var code = document.getElementById('lookup-code').value.trim().toUpperCase();
  var status = document.getElementById('status');
  var result = document.getElementById('lookup-result');
  result.innerHTML = '';
  if(!code){ status.innerHTML = '<span class="bad">Inserisci un codice.</span>'; return; }
  status.textContent = 'Ricerca in corso…';
  fetch(API_BASE + '/api/ticket/' + encodeURIComponent(code))
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){ status.innerHTML = '<span class="bad">Codice non trovato.</span>'; return; }
      status.textContent = '';
      var t = res.data;
      var info = '<div class="info"><b>' + (t.eventTitle||'') + '</b><br>' + (t.tierLabel||'') + (t.buyerName ? '<br>' + t.buyerName : '') + '</div>';
      if(t.paid){ result.innerHTML = '<div class="result">' + info + '<div class="code">Già pagato</div></div>'; return; }
      result.innerHTML = '<div class="result">' + info + '<label>Pagamento ricevuto</label><div class="pay">' + PAYMENTS.map(payOptHTML).join('') + '</div><button id="confirm-btn" disabled>Conferma pagamento</button></div>';
      bindPayOpts(function(){ document.getElementById('confirm-btn').disabled = false; });
      document.getElementById('confirm-btn').onclick = function(){ confirmPayment(code); };
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; });
}
function confirmPayment(code){
  var status = document.getElementById('status');
  status.textContent = 'Conferma in corso…';
  document.getElementById('confirm-btn').disabled = true;
  fetch(API_BASE + '/api/ticket/' + encodeURIComponent(code) + '/confirm-payment', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
    body: JSON.stringify({ paymentMethod: selectedPayment })
  })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){ status.innerHTML = '<span class="bad">Errore, riprova.</span>'; document.getElementById('confirm-btn').disabled = false; return; }
      document.getElementById('view-wrap').innerHTML = '<div class="result"><div class="code">✓ Pagamento confermato</div><button id="new-btn" class="secondary">Nuova ricerca</button></div>';
      document.getElementById('new-btn').onclick = renderView;
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; document.getElementById('confirm-btn').disabled = false; });
}

/* --- Check-in per codice --- */
function renderCheckinCodeForm(){
  document.getElementById('view-wrap').innerHTML =
    '<h1>Check-in (codice)</h1>'
    + '<label for="checkin-code">Codice biglietto</label><input type="text" id="checkin-code" placeholder="XXXX-XXXX-XX" maxlength="14" style="text-transform:uppercase">'
    + '<button id="check-btn">Verifica</button>'
    + '<div id="status" class="status"></div><div id="checkin-result"></div>';
  document.getElementById('check-btn').onclick = function(){ checkTicketCode(document.getElementById('checkin-code').value.trim().toUpperCase()); };
}
function checkTicketCode(code){
  var status = document.getElementById('status');
  var result = document.getElementById('checkin-result');
  result.innerHTML = '';
  if(!code){ status.innerHTML = '<span class="bad">Inserisci un codice.</span>'; return; }
  status.textContent = 'Verifica in corso…';
  fetch(API_BASE + '/api/ticket/' + encodeURIComponent(code))
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      status.textContent = '';
      if(!res.ok || !res.data.ok){ result.innerHTML = '<div class="code pending">✗ Biglietto non valido</div>'; return; }
      var t = res.data;
      var info = '<div class="info"><b>' + (t.eventTitle||'') + '</b><br>' + (t.tierLabel||'') + (t.buyerName ? '<br>' + t.buyerName : '') + '</div>';
      if(t.paid === false){ result.innerHTML = info + '<div class="code pending">✗ NON PAGATO</div>'; return; }
      if(t.used){ result.innerHTML = info + '<div class="code pending">✗ GIÀ USATO</div>'; return; }
      result.innerHTML = info + '<div class="code">✓ VALIDO</div><button id="do-checkin-btn">Segna ingresso</button>';
      document.getElementById('do-checkin-btn').onclick = function(){ doCheckin(code); };
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete.</span>'; });
}
function doCheckin(code){
  var result = document.getElementById('checkin-result');
  result.innerHTML = 'Registrazione…';
  fetch(API_BASE + '/api/ticket/' + encodeURIComponent(code) + '/checkin', { method: 'POST' })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(res.ok && res.data.ok){ result.innerHTML = '<div class="code">✓ INGRESSO REGISTRATO</div>'; }
      else { result.innerHTML = '<div class="code pending">✗ ' + (res.data && res.data.error === 'already-used' ? 'GIÀ USATO' : 'Errore') + '</div>'; }
    })
    .catch(function(){ result.innerHTML = '<div class="code pending">Errore di rete</div>'; });
}

/* --- Check-in per email (gruppo) --- */
function renderCheckinEmailForm(){
  document.getElementById('view-wrap').innerHTML =
    '<h1>Check-in gruppo (email)</h1>'
    + '<label for="group-email">Email acquirente</label><input type="text" id="group-email" placeholder="nome@esempio.it" style="text-transform:none">'
    + '<button id="group-btn">Fai check-in al gruppo</button>'
    + '<div id="status" class="status"></div><div id="group-result"></div>';
  document.getElementById('group-btn').onclick = function(){ checkinByEmail(document.getElementById('group-email').value.trim()); };
}
function checkinByEmail(email){
  var status = document.getElementById('status');
  var result = document.getElementById('group-result');
  result.innerHTML = '';
  if(!email){ status.innerHTML = '<span class="bad">Inserisci un\'email.</span>'; return; }
  status.textContent = 'Check-in in corso…';
  fetch(API_BASE + '/api/tickets/checkin-by-email', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
    body: JSON.stringify({ email: email })
  })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){ status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata.' : 'Errore, riprova.') + '</span>'; return; }
      var results = res.data.results || [];
      if(!results.length){ status.innerHTML = '<span class="bad">Nessun biglietto trovato per questa email.</span>'; return; }
      var labels = { 'checked-in': '✓ Registrato ora', 'already-used': '✗ Già entrato', 'not-paid': '✗ Non pagato' };
      status.innerHTML = '<span class="ok-text">' + results.filter(function(r){ return r.status === 'checked-in'; }).length + ' / ' + results.length + ' registrati ora</span>';
      result.innerHTML = results.map(function(r){ return '<div class="info"><b>' + r.code + '</b> — ' + (r.tierLabel||'') + '<br>' + labels[r.status] + '</div>'; }).join('');
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; });
}

/* --- Lista --- */
let allTickets = [];
function renderListView(){
  document.getElementById('view-wrap').innerHTML = '<h1>Lista biglietti</h1><button id="load-list-btn">Carica / aggiorna</button><div id="status" class="status"></div><div id="list-result"></div>';
  document.getElementById('load-list-btn').onclick = loadList;
}
function payLabelFor(t){ if(t.paid === false) return 'Da pagare'; if(t.paymentMethod === 'cash') return 'Contanti'; if(t.paymentMethod === 'bancomat') return 'Bancomat'; return 'PayPal'; }
function renderTicketRows(tickets){
  return tickets.map(function(t){
    return '<tr><td>' + (t.createdAt ? new Date(t.createdAt).toLocaleTimeString('it-IT') : '') + '</td><td>' + (t.tierLabel||'') + '</td><td>' + (t.buyerName||'') + '</td><td>' + (t.buyerEmail||'') + '</td><td>' + payLabelFor(t) + '</td><td>' + t.code + '</td><td class="' + (t.used ? 'used-yes' : 'used-no') + '">' + (t.used ? '✓' : '—') + '</td><td><button class="del-btn" data-code="' + t.code + '">Elim.</button></td></tr>';
  }).join('');
}
function bindDeleteButtons(){
  document.querySelectorAll('.del-btn').forEach(function(btn){
    btn.onclick = function(){
      var code = btn.dataset.code;
      if(!confirm('Eliminare ' + code + '?')) return;
      fetch(API_BASE + '/api/ticket/' + encodeURIComponent(code), { method: 'DELETE', headers: { 'X-Admin-Key': adminKey } })
        .then(function(r){ return r.json(); })
        .then(function(d){ if(d && d.ok){ allTickets = allTickets.filter(function(t){ return t.code !== code; }); btn.closest('tr').remove(); } else { alert('Errore.'); } })
        .catch(function(){ alert('Errore di rete.'); });
    };
  });
}
function renderTicketTable(tickets){
  var usedCount = tickets.filter(function(t){ return t.used; }).length;
  var table = '<div class="summary">' + tickets.length + ' mostrati · ' + usedCount + ' entrati</div><div style="overflow-x:auto"><table><thead><tr><th>Ora</th><th>Tariffa</th><th>Nome</th><th>Email</th><th>Pag.</th><th>Codice</th><th>In</th><th></th></tr></thead><tbody>' + renderTicketRows(tickets) + '</tbody></table></div>';
  document.getElementById('table-wrap').innerHTML = table;
  bindDeleteButtons();
}
function loadList(){
  var status = document.getElementById('status');
  var result = document.getElementById('list-result');
  status.textContent = 'Caricamento…';
  result.innerHTML = '';
  fetch(API_BASE + '/api/tickets', { headers: { 'X-Admin-Key': adminKey } })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){ status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata.' : 'Errore.') + '</span>'; return; }
      var excludedEmails = ['fedeneri.fm'];
      allTickets = (res.data.tickets || []).filter(function(t){
        if(t.eventId !== selectedEvent.id) return false;
        return !excludedEmails.some(function(ex){ return (t.buyerEmail||'').toLowerCase().indexOf(ex) !== -1; });
      });
      status.textContent = '';
      if(!allTickets.length){ result.innerHTML = '<div class="info">Nessun biglietto.</div>'; return; }
      result.innerHTML = '<input type="text" id="search-box" placeholder="Cerca per nome o email…" style="text-transform:none;margin-bottom:12px"><div id="table-wrap"></div>';
      document.getElementById('search-box').oninput = function(){
        var q = this.value.trim().toLowerCase();
        var filtered = !q ? allTickets : allTickets.filter(function(t){
          return (t.buyerName||'').toLowerCase().indexOf(q) !== -1 || (t.buyerEmail||'').toLowerCase().indexOf(q) !== -1;
        });
        renderTicketTable(filtered);
      };
      renderTicketTable(allTickets);
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; });
}
/* --- Pagamenti PayPal senza biglietto (con avviso: il confronto puo' dare
   falsi positivi, verificare sempre a mano prima di generare) --- */
function renderReconcileView(){
  document.getElementById('view-wrap').innerHTML =
    '<h1>Pagamenti PayPal</h1>'
    + '<div class="info" style="background:#fff6cf;border:2px solid #164194;padding:10px;margin-bottom:14px">⚠️ Questo confronto a volte segnala per errore pagamenti come "mancanti" anche se il biglietto esiste già. <b>Prima di generare, controlla nella scheda "Lista" (cerca il nome o l\'email) che non ci sia già.</b></div>'
    + '<label for="reconcile-key">Chiave riconciliazione</label><input type="password" id="reconcile-key" placeholder="RECONCILE_KEY">'
    + '<label for="reconcile-days">Ultimi quanti giorni</label><input type="text" id="reconcile-days" value="3" style="max-width:80px">'
    + '<button id="reconcile-btn">Cerca pagamenti mancanti</button>'
    + '<div id="status" class="status"></div><div id="reconcile-result"></div>';
  document.getElementById('reconcile-btn').onclick = searchReconcile;
}
function searchReconcile(){
  var rkey = document.getElementById('reconcile-key').value.trim();
  var days = document.getElementById('reconcile-days').value.trim() || '3';
  var status = document.getElementById('status');
  var result = document.getElementById('reconcile-result');
  if(!rkey){ status.innerHTML = '<span class="bad">Inserisci la chiave di riconciliazione.</span>'; return; }
  status.textContent = 'Ricerca in corso…';
  result.innerHTML = '';
  fetch(API_BASE + '/api/reconcile?days=' + encodeURIComponent(days), { headers: { 'X-Reconcile-Key': rkey } })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(res){
      if(!res.ok || !res.data.ok){ status.innerHTML = '<span class="bad">' + (res.data && res.data.error === 'unauthorized' ? 'Chiave sbagliata.' : 'Errore, riprova.') + '</span>'; return; }
      var missing = res.data.dettaglio || [];
      status.textContent = res.data.transazioniCompletate + ' pagamenti esaminati · ' + missing.length + ' segnalati come mancanti';
      if(!missing.length){ result.innerHTML = '<div class="info">Nessuno.</div>'; return; }
      var tierOptions = TIERS_current().map(function(t){ return '<option value="' + t.id + '">' + t.label + ' (' + t.price + ' €)</option>'; }).join('');
      result.innerHTML = missing.map(function(m, i){
        return '<div style="border:2px solid #164194;padding:12px;margin-bottom:10px">'
          + '<div><b>' + (m.payerName || 'Nome sconosciuto') + '</b> — ' + (m.payerEmail || 'email sconosciuta') + '</div>'
          + '<div style="font-size:11px;color:#444">' + m.amount + ' ' + m.currency + ' · ' + (m.date || '') + '</div>'
          + '<select id="rec-tier-' + i + '" style="width:100%;padding:8px;border:2px solid #164194;font-family:inherit;margin-top:8px">' + tierOptions + '</select>'
          + '<button data-idx="' + i + '" class="rec-gen-btn">Genera biglietto (dopo aver controllato la Lista)</button>'
          + '<div id="rec-status-' + i + '" class="status"></div>'
          + '</div>';
      }).join('');
      document.querySelectorAll('.rec-gen-btn').forEach(function(btn){
        btn.onclick = function(){
          var i = btn.dataset.idx;
          var m = missing[i];
          var tierId = document.getElementById('rec-tier-' + i).value;
          var tier = TIERS_current().find(function(t){ return t.id === tierId; });
          var rstatus = document.getElementById('rec-status-' + i);
          rstatus.textContent = 'Generazione in corso…';
          fetch(API_BASE + '/api/reconcile-create-ticket', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
            body: JSON.stringify({ orderId: m.orderId, eventId: selectedEvent.id, eventTitle: selectedEvent.title, tierId: tier.id, tierLabel: tier.label, buyerEmail: m.payerEmail, buyerName: m.payerName })
          })
            .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
            .then(function(res2){
              if(!res2.ok || !res2.data.ok){ rstatus.innerHTML = '<span class="bad">Errore, riprova.</span>'; return; }
              rstatus.innerHTML = '<span class="ok-text">✓ ' + res2.data.code + (res2.data.alreadyIssued ? ' (era già stato generato)' : '') + '</span>';
              btn.disabled = true;
            })
            .catch(function(){ rstatus.innerHTML = '<span class="bad">Errore di rete.</span>'; });
        };
      });
    })
    .catch(function(){ status.innerHTML = '<span class="bad">Errore di rete, riprova.</span>'; });
}
</script>
